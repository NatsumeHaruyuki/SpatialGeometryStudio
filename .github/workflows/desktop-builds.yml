name: Desktop builds

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build native application folder and ZIP
        run: npm run package:mac:${{ matrix.arch }}
      - name: Test relocated packaged application offline
        run: npm run test:distribution -- --arch ${{ matrix.arch }}
      - name: Upload macOS distribution
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: SpatialGeometryStudio-macOS-${{ matrix.arch }}
          path: |
            release-v*/SpatialGeometryStudio-macOS-*.zip
            release-v*/SpatialGeometryStudio-macOS-*.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload validation screenshot
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: validation-macOS-${{ matrix.arch }}
          path: .qa/distribution-darwin-${{ matrix.arch }}.png
          if-no-files-found: ignore
          retention-days: 30
